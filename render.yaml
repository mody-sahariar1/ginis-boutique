# Render Blueprint — one-click deploy of Gini's Boutique.
# Deploy link: https://render.com/deploy?repo=https://github.com/mody-sahariar1/ginis-boutique
services:
  - type: web
    name: ginis-boutique
    runtime: python
    plan: free
    region: singapore          # closest Render region to West Bengal
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MODIS_ENV
        value: production
      - key: MODIS_SECRET_KEY   # random secret, generated by Render
        generateValue: true
      - key: AUTO_SEED          # fill the fresh DB with the opening collection
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # To make the live site PRIVATE (password to view), add in the Render
      # dashboard:  SITE_PASSWORD = <your password>   (username defaults to "gini")
