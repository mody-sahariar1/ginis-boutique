{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Record Sale</h1>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Product</label>
    <select class="form-select" name="product_id" required>
      {% for p in products %}
      <option value="{{ p.id }}">{{ p.name }} (stock: {{ p.quantity }}, ₹{{ "%.2f"|format(p.price) }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Quantity Sold</label>
    <input type="number" min="1" class="form-control" name="quantity" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Sale Price (per unit, optional — defaults to catalog price)</label>
    <input type="number" step="0.01" min="0" class="form-control" name="sale_price">
  </div>
  <button type="submit" class="btn btn-success">Record Sale</button>
</form>
{% endblock %}
