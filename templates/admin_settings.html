{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Account Settings</h1>
<p class="text-muted">Set your own username and password here — don't share these with anyone, including in chat.</p>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Current Password</label>
    <input type="password" class="form-control" name="current_password" required>
  </div>
  <div class="mb-3">
    <label class="form-label">New Username (leave blank to keep current)</label>
    <input type="text" class="form-control" name="new_username">
  </div>
  <div class="mb-3">
    <label class="form-label">New Password (leave blank to keep current, min 8 characters)</label>
    <input type="password" class="form-control" name="new_password" minlength="8">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm New Password</label>
    <input type="password" class="form-control" name="confirm_password" minlength="8">
  </div>
  <button type="submit" class="btn btn-primary">Update</button>
</form>
{% endblock %}
